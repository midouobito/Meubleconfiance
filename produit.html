<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">تفاصيل المنتج | أثاث الثقة باتنة 05</title>
<meta name="description" id="pageDesc" content="تفاصيل المنتج — أثاث الثقة باتنة 05">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="style.css">
<script>
  (function(){
    var t = localStorage.getItem("theme") || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
</head>
<body data-page="produit">

<div id="site-header"></div>

<div class="page-hero" style="padding:30px 0;">
  <div class="container">
    <div class="breadcrumb">
      <a href="index.html">الرئيسية</a> ←
      <a href="catalogue.html">الكتالوج</a> ←
      <span id="crumbCat"></span>
    </div>
  </div>
</div>

<section class="container" id="productRoot">
  <!-- عرض هيكلي مؤقت أثناء التحميل -->
  <div class="pd-grid">
    <div class="skel skel-pd-main"></div>
    <div>
      <div class="skel skel-line" style="width:30%; height:14px;"></div>
      <div class="skel skel-line" style="width:70%; height:28px; margin-top:14px;"></div>
      <div class="skel skel-line" style="width:40%; height:24px; margin-top:20px;"></div>
      <div class="skel skel-line" style="width:95%; margin-top:24px;"></div>
      <div class="skel skel-line" style="width:85%;"></div>
      <div class="skel skel-line" style="width:60%;"></div>
    </div>
  </div>
</section>

<section class="related">
  <div class="container">
    <div class="section-head">
      <div>
        <div class="eyebrow">قد يعجبك أيضاً</div>
        <h2>منتجات من نفس التصنيف</h2>
      </div>
    </div>
    <div class="product-grid" id="relatedGrid"></div>
  </div>
</section>

<div id="site-footer"></div>

<!-- شريط ثابت للطلب على الجوال -->
<div class="sticky-order-bar" id="stickyOrderBar" style="display:none;">
  <span class="sob-price" id="sobPrice"></span>
  <button class="btn btn-primary" id="sobOrderBtn">اطلب الآن</button>
</div>

<!-- Modal COD -->
<div id="codModal" class="modal" style="display:none; position:fixed; z-index:9999; left:0; top:0; width:100%; height:100%; background-color:rgba(0,0,0,0.5); overflow:auto;">
  <div class="modal-content" style="background-color:var(--paper); margin:10% auto; padding:20px; border-radius:10px; width:90%; max-width:500px; position:relative;">
    <span class="close-modal" style="position:absolute; top:10px; left:15px; font-size:28px; font-weight:bold; cursor:pointer; color:#999;">&times;</span>
    <h2 style="margin-top:0; font-family:'Cairo', sans-serif;">إتمام الطلب (الدفع عند الاستلام)</h2>
    <p style="margin-bottom:20px; font-size:14px; color:#666;">الرجاء إدخال معلوماتك وسنقوم بالاتصال بك لتأكيد الطلب.</p>
    <form id="codForm">
      <div class="form-group" style="margin-bottom:15px;">
        <label style="display:block; margin-bottom:5px; font-weight:bold;">الاسم الكامل</label>
        <input type="text" id="codName" required style="width:100%; padding:10px; border:1px solid #ccc; border-radius:5px; font-family:inherit;">
      </div>
      <div class="form-group" style="margin-bottom:15px;">
        <label style="display:block; margin-bottom:5px; font-weight:bold;">رقم الهاتف</label>
        <input type="tel" id="codPhone" required pattern="0[5-7][0-9]{8}" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:5px; font-family:inherit;" dir="ltr" placeholder="06XXXXXXXX">
      </div>
      <div class="form-group" style="margin-bottom:15px;">
        <label style="display:block; margin-bottom:5px; font-weight:bold;">الولاية</label>
        <input type="text" id="codWilaya" required style="width:100%; padding:10px; border:1px solid #ccc; border-radius:5px; font-family:inherit;">
      </div>
      <div class="form-group" style="margin-bottom:15px;">
        <label style="display:block; margin-bottom:5px; font-weight:bold;">العنوان الكامل</label>
        <input type="text" id="codAddress" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:5px; font-family:inherit;">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:10px;">تأكيد الطلب</button>
    </form>
    <div id="codSuccess" style="display:none; color:var(--success); text-align:center; padding:20px 0; font-weight:bold;">
      تم تسجيل طلبك بنجاح! سنتصل بك قريباً لتأكيد التوصيل.
    </div>
  </div>
</div>

<!-- Supabase CDN and Client initialization -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="products.js"></script>
<script src="main.js"></script>
<script>
  const urlParams = new URLSearchParams(window.location.search);
  const rawId = urlParams.get("id");

  // Detect if the ID is a valid UUID (which matches Supabase table)
  const isUuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(rawId);

  async function initProductPage() {
    let product = null;

    if (isUuid) {
      try {
        const { data: post, error } = await supabaseClient
          .from("products")
          .select("*")
          .eq("id", rawId)
          .single();

        if (error) throw error;
        if (post) {
          product = mapRowToProduct(post);
        }
      } catch (err) {
        console.error("Failed to load product from Supabase, loading fallback mock product:", err);
      }
    } else {
      // Fallback to static product list by integer index
      const idInt = parseInt(rawId);
      product = PRODUCTS.find(p => p.id === idInt) || PRODUCTS[0];
    }

    if (!product) {
      product = PRODUCTS[0];
    }

    renderProductDetail(product);
    renderRelatedProducts(product);
  }

  function renderProductDetail(product) {
    document.getElementById("pageTitle").textContent = product.name + " | أثاث الثقة باتنة 05";
    document.getElementById("pageDesc").setAttribute("content", product.description.slice(0, 140));
    document.getElementById("crumbCat").innerHTML = `<a href="catalogue.html?cat=${encodeURIComponent(product.category)}">${product.category}</a> ← ${product.name}`;

    const root = document.getElementById("productRoot");
    root.innerHTML = `
      <div class="pd-grid">
        <div class="pd-gallery">
          <div class="pd-main" id="pdMain">
            ${product.images.map((img,i) => `<img src="${img}" class="${i===0?'active':''}" alt="${product.name} — صورة ${i+1}" ${i===0?'':'loading="lazy"'}>`).join("")}
            <div class="pd-rotate-hint" id="rotateHint">↔ حرّك الماوس لمشاهدة الزوايا</div>
          </div>
          <div class="pd-thumbs" id="pdThumbs">
            ${product.images.map((img,i) => `<button class="${i===0?'active':''}" data-i="${i}"><img src="${img}" alt="زاوية ${i+1}" loading="lazy"></button>`).join("")}
          </div>
        </div>
        <div class="pd-info">
          <div class="p-cat">${product.category}</div>
          <h1>${product.name}</h1>
          <div class="pd-price-block">
            <span class="pd-price">${product.price > 0 ? formatPrice(product.price) : "اتصل لمعرفة السعر"}</span>
            ${product.oldPrice ? `<span class="pd-price-old">${formatPrice(product.oldPrice)}</span>` : ""}
            ${product.badge ? `<span class="badge" style="position:static;">${product.badge}</span>` : ""}
          </div>
          <p class="pd-desc" style="white-space: pre-wrap;">${product.description}</p>

          <div class="color-row">
            <span style="font-size:13px; opacity:.7;">الألوان المتوفرة:</span>
            ${product.colors.map(c => `<span class="sw" style="background:${c};"></span>`).join("")}
          </div>

          <table class="spec-table">
            <tr><td>التصنيف</td><td>${product.category}</td></tr>
            <tr><td>الخامة</td><td>${product.material}</td></tr>
            <tr><td>الأبعاد</td><td>${product.dimensions}</td></tr>
            <tr><td>التوصيل</td><td>لكل الولايات — تركيب مجاني ببعض المناطق</td></tr>
            <tr><td>الدفع</td><td>الدفع عند الاستلام متاح</td></tr>
          </table>

          <div class="pd-actions" style="display:flex; flex-direction:column; gap:10px;">
            <button id="btnCod" class="btn btn-primary" style="width:100%;">اطلب الآن (الدفع عند الاستلام)</button>
            <div style="display:flex; gap:10px; width:100%;">
              <a href="https://wa.me/213671946690?text=${encodeURIComponent('مرحباً، أنا مهتم بمنتج: ' + product.name + '\n' + (product.originalUrl || window.location.href))}" target="_blank" rel="noopener" class="btn btn-primary" style="background:#25D366; border-color:#25D366; flex:1;">اطلب عبر واتساب</a>
              <a href="tel:0671946690" class="btn btn-outline" style="flex:1;">اتصل الآن</a>
            </div>
          </div>
          <div class="pd-note">💬 الأسعار والمقاسات قابلة للتعديل حسب الطلب. تواصل معنا لتأكيد التوفر في منطقتك.</div>
        </div>
      </div>
    `;

    // شريط الطلب الثابت على الجوال
    const sob = document.getElementById("stickyOrderBar");
    document.getElementById("sobPrice").textContent = product.price > 0 ? formatPrice(product.price) : "اتصل لمعرفة السعر";
    sob.style.display = "flex";

    // Interactivity: Rotate Gallery
    const pdMain = document.getElementById("pdMain");
    const thumbBtns = document.querySelectorAll("#pdThumbs button");
    const mainImgs = pdMain.querySelectorAll("img");
    let hovering = false;

    function setActiveImage(i) {
      mainImgs.forEach((im, idx) => im.classList.toggle("active", idx === i));
      thumbBtns.forEach((b, idx) => b.classList.toggle("active", idx === i));
    }

    pdMain.addEventListener("mousemove", (e) => {
      hovering = true;
      const hint = document.getElementById("rotateHint");
      if (hint) hint.style.opacity = "0";
      const rect = pdMain.getBoundingClientRect();
      const ratio = (e.clientX - rect.left) / rect.width;
      const idx = Math.min(mainImgs.length - 1, Math.max(0, Math.floor(ratio * mainImgs.length)));
      setActiveImage(idx);
    });

    pdMain.addEventListener("mouseleave", () => {
      hovering = false;
      const hint = document.getElementById("rotateHint");
      if (hint) hint.style.opacity = "1";
    });

    thumbBtns.forEach(btn => {
      btn.addEventListener("click", () => setActiveImage(parseInt(btn.dataset.i)));
    });

    if (product.images.length > 1) {
      const icon = document.createElement("div");
      icon.className = "rotate-indicator";
      icon.innerHTML = "↔";
      icon.title = "حرّك الماوس لتدوير المنتج";
      pdMain.appendChild(icon);
    }
    initTiltCards();
    addRotateIndicators();

    // Modal Logic
    const btnCod = document.getElementById("btnCod");
    const sobOrderBtn = document.getElementById("sobOrderBtn");
    const codModal = document.getElementById("codModal");
    const closeModal = document.querySelector(".close-modal");
    const codForm = document.getElementById("codForm");
    const codSuccess = document.getElementById("codSuccess");

    function openCodModal() {
      codModal.style.display = "block";
      codForm.style.display = "block";
      codSuccess.style.display = "none";
      codForm.reset();
    }

    if (btnCod) btnCod.addEventListener("click", openCodModal);
    if (sobOrderBtn) sobOrderBtn.addEventListener("click", openCodModal);

    closeModal.addEventListener("click", () => {
      codModal.style.display = "none";
    });

    window.addEventListener("click", (e) => {
      if (e.target === codModal) {
        codModal.style.display = "none";
      }
    });

    codForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btnSubmit = codForm.querySelector('button[type="submit"]');
      btnSubmit.disabled = true;
      btnSubmit.textContent = "جاري التأكيد...";

      const orderData = {
        product_id: product.id,
        product_name: product.name,
        price: product.price,
        customer_name: document.getElementById("codName").value,
        customer_phone: document.getElementById("codPhone").value,
        customer_wilaya: document.getElementById("codWilaya").value,
        customer_address: document.getElementById("codAddress").value,
        status: 'pending'
      };

      try {
        const { error } = await supabaseClient.from('orders').insert([orderData]);
        if (error) throw error;

        codForm.style.display = "none";
        codSuccess.style.display = "block";
        showToast("تم تسجيل طلبك بنجاح! سنتصل بك قريباً.", "success");
      } catch (err) {
        console.error("Order error:", err);
        showToast("حدث خطأ أثناء تسجيل الطلب، يرجى المحاولة عبر الهاتف أو واتساب.", "error");
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = "تأكيد الطلب";
      }
    });
  }

  function renderRelatedProducts(product) {
    // Show related items from static database or just fallback list
    const related = PRODUCTS.filter(p => p.category === product.category && p.id !== product.id).slice(0, 4);
    document.getElementById("relatedGrid").innerHTML = related.map(p => `
      <a href="produit.html?id=${p.id}" class="product-card">
        <div class="thumb-wrap">
          ${p.badge ? `<span class="badge">${p.badge}</span>` : ""}
          <img src="${p.images[0]}" class="active" alt="${p.name}" loading="lazy">
        </div>
        <div class="p-info">
          <div class="p-cat">${p.category}</div>
          <div class="p-name">${p.name}</div>
          <div class="p-price-row">
            <span class="p-price">${p.price > 0 ? formatPrice(p.price) : "اتصل لمعرفة السعر"}</span>
            <div class="p-view">←</div>
          </div>
        </div>
      </a>
    `).join("");

    initTiltCards();
    addRotateIndicators();
  }

  // Run initialisation
  initProductPage();
</script>
</body>
</html>

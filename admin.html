<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard | أثاث الثقة باتنة 05</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body style="background-color: #f4f6f8;">

  <!-- Login Screen -->
  <div id="loginScreen" class="admin-login-wrapper">
    <div class="admin-login-box">
      <h2>تسجيل الدخول للإدارة</h2>
      <form id="loginForm">
        <div class="form-group" style="margin-bottom:15px;">
          <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" required dir="ltr" style="width:100%; padding:10px;">
        </div>
        <div class="form-group" style="margin-bottom:15px;">
          <input type="password" id="loginPassword" placeholder="كلمة المرور" required dir="ltr" style="width:100%; padding:10px;">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">دخول</button>
      </form>
      <div id="loginError" style="color:red; margin-top:10px; font-size:14px; display:none;"></div>
    </div>
  </div>

  <!-- Dashboard Screen -->
  <div id="dashboardScreen" class="admin-dashboard-wrapper" style="display:none;">
    <aside class="admin-sidebar">
      <div class="sidebar-brand">
        <h3>أثاث الثقة Admin</h3>
      </div>
      <ul class="sidebar-nav">
        <li><button class="nav-btn active" data-target="productsTab">📦 المنتجات</button></li>
        <li><button class="nav-btn" data-target="ordersTab">🛒 الطلبيات COD</button></li>
      </ul>
      <div class="sidebar-footer">
        <button id="logoutBtn" class="btn btn-outline" style="width:100%; background:#fff; color:#222;">تسجيل الخروج</button>
      </div>
    </aside>

    <main class="admin-main">
      <!-- Products Tab -->
      <section id="productsTab" class="tab-content active">
        <div class="tab-header">
          <h2>إدارة المنتجات</h2>
          <button id="btnNewProduct" class="btn btn-primary">إضافة منتج جديد</button>
        </div>
        <div class="table-responsive bg-white">
          <table class="admin-table">
            <thead>
              <tr>
                <th>صورة</th>
                <th>الاسم</th>
                <th>التصنيف</th>
                <th>السعر (دج)</th>
                <th>الحالة</th>
                <th>إجراءات</th>
              </tr>
            </thead>
            <tbody id="productsTableBody">
              <!-- Populated by JS -->
            </tbody>
          </table>
        </div>
      </section>

      <!-- Orders Tab -->
      <section id="ordersTab" class="tab-content" style="display:none;">
        <div class="tab-header">
          <h2>إدارة الطلبيات (الدفع عند الاستلام)</h2>
        </div>
        <div class="table-responsive bg-white">
          <table class="admin-table">
            <thead>
              <tr>
                <th>التاريخ</th>
                <th>العميل</th>
                <th>الولاية / العنوان</th>
                <th>المنتج</th>
                <th>الحالة</th>
                <th>إجراءات</th>
              </tr>
            </thead>
            <tbody id="ordersTableBody">
              <!-- Populated by JS -->
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- Product Modal (Add/Edit) -->
  <div id="productModal" class="modal" style="display:none;">
    <div class="modal-content admin-modal" style="max-width:800px; padding:30px;">
      <span class="close-modal">&times;</span>
      <h2 id="productModalTitle" style="margin-top:0;">إضافة منتج</h2>
      <form id="productForm">
        <input type="hidden" id="prodId">
        
        <div style="display:flex; gap:20px;">
          <div style="flex:2;">
            <div class="form-group" style="margin-bottom:15px;">
              <label>اسم المنتج</label>
              <input type="text" id="prodName" required style="width:100%; padding:10px;">
            </div>
            <div class="form-group" style="margin-bottom:15px;">
              <label>الوصف</label>
              <textarea id="prodDesc" rows="5" style="width:100%; padding:10px;"></textarea>
            </div>
            
            <div style="display:flex; gap:15px; margin-bottom:15px;">
              <div class="form-group" style="flex:1;">
                <label>السعر (دج)</label>
                <input type="number" id="prodPrice" required style="width:100%; padding:10px;">
              </div>
              <div class="form-group" style="flex:1;">
                <label>السعر القديم (دج)</label>
                <input type="number" id="prodOldPrice" style="width:100%; padding:10px;">
              </div>
            </div>

            <div style="display:flex; gap:15px; margin-bottom:15px;">
              <div class="form-group" style="flex:1;">
                <label>الخامة</label>
                <input type="text" id="prodMaterial" placeholder="خشب صلب عالي الجودة" style="width:100%; padding:10px;">
              </div>
              <div class="form-group" style="flex:1;">
                <label>الأبعاد</label>
                <input type="text" id="prodDimensions" placeholder="مثال: 200x160 سم" style="width:100%; padding:10px;">
              </div>
            </div>

          </div>

          <div style="flex:1;">
            <div class="form-group" style="margin-bottom:15px;">
              <label>التصنيف</label>
              <select id="prodCategory" style="width:100%; padding:10px;">
                <option value="صالونات">صالونات</option>
                <option value="غرف نوم">غرف نوم</option>
                <option value="طاولات وكراسي">طاولات وكراسي</option>
                <option value="مطابخ">مطابخ</option>
                <option value="مكاتب">مكاتب</option>
                <option value="ديكور وإكسسوارات">ديكور وإكسسوارات</option>
                <option value="Autre">أخرى</option>
              </select>
            </div>
            
            <div class="form-group" style="margin-bottom:15px;">
              <label>الصورة الرئيسية</label>
              <div style="border:2px dashed #ccc; padding:20px; text-align:center; border-radius:8px;">
                <input type="file" id="prodImageFile" accept="image/*" style="max-width:100%;">
                <div style="margin-top:10px; font-size:12px; color:#666;">أو رابط صورة مباشرة:</div>
                <input type="url" id="prodImageUrl" placeholder="https://..." dir="ltr" style="width:100%; padding:5px; margin-top:5px;">
              </div>
              <img id="prodImagePreview" src="" style="width:100%; max-height:150px; object-fit:contain; display:none; margin-top:10px; border-radius:5px;">
            </div>

            <div class="form-group" style="margin-bottom:15px; background:#f9f9f9; padding:10px; border-radius:5px;">
              <label style="display:flex; align-items:center; cursor:pointer;">
                <input type="checkbox" id="prodActive" checked style="margin-left:10px;"> 
                <span>منتج مرئي في الموقع</span>
              </label>
            </div>
          </div>
        </div>

        <div style="border-top:1px solid #eee; padding-top:15px; text-align:left;">
          <button type="submit" class="btn btn-primary" id="btnSaveProduct">حفظ المنتج</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="admin.js"></script>
</body>
</html>
